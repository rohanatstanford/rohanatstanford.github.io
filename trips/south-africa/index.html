<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#ffffff; --soft:#f6f7f9; --card:#ffffff; --ink:#1c2430; --muted:#6b7280; --line:#e6e8ec;
  --accent:#ff5a36; --accent-soft:#fff0ec; --green:#1f7a52; --green-soft:#e7f5ee;
  --blue:#2f6fde; --blue-soft:#eaf1fd; --warn:#b26a00; --warn-soft:#fff5e0;
  --rec:#6a4fc4; --rec-bg:#f4f1fd;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --r:14px; --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;background:#f7f5f0}
#gateForm{display:flex;flex-direction:column;gap:8px}
#pw,#who{width:150px;padding:8px 12px;border:1px solid #ddd8cc;border-radius:10px;background:transparent;text-align:center;letter-spacing:.2em;outline:none;color:#888}
#pw:focus,#who:focus{border-color:#aaa}
#gate.no #gateForm{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) minmax(0,44%);height:100vh;height:100dvh}
.nav{border-right:1px solid var(--line);background:var(--soft);overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.content{overflow-y:auto;min-width:0;scroll-behavior:smooth}
.mapcol{position:relative;border-left:1px solid var(--line)}
#map{position:absolute;inset:0;background:#eef0f2}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:14px;line-height:1.2}
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--ink);width:100%}
.nav-item:hover{background:#eceef1}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .ic{width:20px;text-align:center}
.nav-days{display:flex;flex-direction:column;margin:2px 0 6px 30px;border-left:2px solid var(--line)}
.nav-day{border:0;background:none;text-align:left;padding:4px 10px;font-size:13px;color:var(--muted);border-radius:0 8px 8px 0;display:flex;gap:8px;align-items:center}
.nav-day:hover{color:var(--ink);background:#eceef1}
.nav-day i{width:8px;height:8px;border-radius:50%;flex:none}
.nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}

.tabs-m{display:none}
.wrap{max-width:820px;margin:0 auto;padding:0 28px 120px}

/* ---------- hero ---------- */
.hero{padding:26px 0 6px}
.hero-card{border-radius:18px;padding:22px 22px 18px;background:linear-gradient(135deg,#fff3ec 0%,#eef5ff 100%);border:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:30px;line-height:1.15;margin:4px 0 4px;letter-spacing:-.02em}
.dates{color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatars{display:inline-flex}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;border:2px solid #fff;margin-left:-6px}
.avatar:first-child{margin-left:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.chip b{color:var(--accent)}

/* ---------- common ---------- */
.section{padding-top:22px}
h2{font-size:22px;margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c9ced6;background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#f04a26}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.b-paid{background:var(--green-soft);color:var(--green)}
.b-owed{background:var(--accent-soft);color:var(--accent)}
.b-pending{background:var(--warn-soft);color:var(--warn)}
.b-idea{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.b-points{background:#eeeafd;color:#4a3fa3}
.b-rec{background:var(--rec);color:#fff}
.b-you{background:var(--blue-soft);color:var(--blue)}
.by{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.by i{width:8px;height:8px;border-radius:50%;display:inline-block}
.act{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.act:last-child{border-bottom:0}
.act .avatar{width:24px;height:24px;font-size:10px;border:0;margin:0;flex:none}
.mail{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.mail a{text-decoration:none}
.doc-pill{display:inline-flex;gap:6px;align-items:center;border:1px solid #c9d8f5;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;background:var(--blue-soft);color:var(--blue);cursor:pointer}
.me{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px}
.flag{background:var(--warn-soft);border-left:3px solid #f0a020;padding:6px 10px;border-radius:8px;font-size:13px;margin-top:6px}
input.field,select.field,textarea.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}

/* ---------- itinerary ---------- */
.daystrip{display:none;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.daystrip button{flex:none}
.day{border-top:1px solid var(--line);padding:18px 0 8px}
.day-head{display:flex;align-items:flex-start;gap:10px}
.day-toggle{border:0;background:none;padding:2px 0;display:flex;gap:10px;align-items:flex-start;text-align:left;flex:1;min-width:0}
.chev{display:inline-block;transition:transform .15s;color:var(--muted);font-size:13px;margin-top:5px;width:12px}
.day.open .chev{transform:rotate(90deg)}
.day-title{font-weight:800;font-size:18px;letter-spacing:-.01em}
.day-sub{font-size:13px;color:var(--muted)}
.day-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.day-body{display:none;padding:10px 0 0 22px}
.day.open .day-body{display:block}
.day.today .day-title::after{content:"Today";font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.stop:hover{border-color:#c9ced6;box-shadow:var(--shadow)}
.stop.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stop.rec{background:var(--rec-bg);border:1px dashed #b9a9ee}
.stop.user{border-left:3px solid var(--blue)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.num.nomap{background:var(--soft)!important;color:var(--muted);border:1px solid var(--line)}
.num.recnum{background:#fff;border:1.5px dashed var(--rec)}
.stop-time{font-size:12px;font-weight:700;color:var(--muted)}
.stop-title{font-weight:700;line-height:1.35}
.stop-note{font-size:13px;color:#4b5563;margin-top:3px}
.stop-links{display:flex;gap:12px;margin-top:6px;font-size:12px;font-weight:600;flex-wrap:wrap}
.stop-links a{text-decoration:none}
.stop-tools{display:flex;flex-direction:column;gap:2px;opacity:.35;transition:opacity .15s}
.stop:hover .stop-tools,.stop.sel .stop-tools{opacity:1}
.tool{border:0;background:none;width:26px;height:24px;border-radius:6px;color:var(--muted);font-size:13px;padding:0}
.tool:hover{background:var(--soft);color:var(--ink)}
.conn{display:flex;align-items:center;gap:8px;margin:0 0 0 26px;padding:6px 0 6px 20px;border-left:2px dotted #cfd4db;font-size:12px;color:var(--muted)}
.conn a{font-weight:600;text-decoration:none}
.editbox{display:grid;gap:6px;margin-top:8px}
.editbox .row input{flex:1}
.adder{position:relative;margin:10px 0 6px}
.adder input{padding-left:36px;background:var(--soft);border-color:transparent}
.adder input:focus{background:#fff}
.adder .pin-ic{position:absolute;left:12px;top:9px;color:var(--muted)}
.results{position:absolute;z-index:1200;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(16,24,40,.12);overflow:hidden;max-height:320px;overflow-y:auto}
.result{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result:hover,.result.hl{background:var(--soft)}
.result b{display:block;font-size:14px}
.result span{font-size:12px;color:var(--muted)}
body.hide-recs .stop.rec, body.hide-recs .conn.rec, body.hide-recs .rec-pin{display:none!important}

/* ---------- reservations ---------- */
.res-head{display:flex;gap:12px;align-items:flex-start}
.res-icon{font-size:20px;width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0;font-size:13px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
.conf{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border:1px solid var(--line);padding:0 6px;border-radius:6px;cursor:copy}
.att{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file-pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--soft);cursor:pointer}
.res-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.res-strip button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left}
.res-strip button:hover{border-color:#c9ced6}
.res-strip b{display:block;font-size:20px}
.res-strip span{font-size:12px;color:var(--muted)}

/* ---------- budget ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bar{height:12px;border-radius:999px;background:var(--accent-soft);overflow:hidden;display:flex}
.bar span{background:var(--green);display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
.expform{display:grid;grid-template-columns:2fr 1fr 1fr 90px 1fr auto;gap:8px;align-items:center}

/* ---------- todo ---------- */
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line)}
.todo input{margin-top:4px;width:18px;height:18px;accent-color:var(--green)}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo .del{margin-left:auto;border:0;background:none;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}

/* ---------- map ---------- */
.map-tools{position:absolute;z-index:500;top:12px;left:56px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
.map-tools select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.map-tools .btn{box-shadow:var(--shadow)}
.map-close{display:none}
.leaflet-container{font-family:var(--font)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:opacity .2s}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:11px}
.pin.rec{background:#fff;border-width:3px;width:24px;height:24px}
.pin.saved{background:#fff;border:3px solid #9aa1ab}
.pin.saved span{color:#6b7280}
.pin.dim{opacity:.28}
.fab{display:none}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;z-index:3000;pointer-events:none}
.toast.show{opacity:1}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .app{grid-template-columns:200px minmax(0,1fr) minmax(0,40%)} .wrap{padding:0 20px 120px} }
@media (max-width:960px){
  .app{display:block;height:auto}
  .nav{display:none}
  .content{overflow:visible}
  .wrap{padding:0 16px 110px}
  .tabs-m{display:flex;position:sticky;top:0;z-index:900;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs-m button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
  .tabs-m button.active{background:var(--accent-soft);color:var(--accent)}
  .daystrip{display:flex;position:sticky;top:53px;z-index:800;background:#fff;padding-top:8px}
  .mapcol{position:fixed;inset:0;z-index:1500;border:0;transform:translateY(100%);transition:transform .25s;background:#fff}
  .app.show-map .mapcol{transform:none}
  .map-close{display:inline-flex}
  .map-tools{left:12px;top:auto;bottom:24px;justify-content:center}
  .fab{display:inline-flex;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);gap:8px}
  .app.show-map .fab{display:none}
  h1{font-size:25px}
  .expform{grid-template-columns:1fr 1fr}
  .expform .wide{grid-column:1/-1}
  .stop-tools{opacity:1}
  .day-body{padding-left:0}
  .day-head{flex-wrap:wrap}
}
@media print{
  .nav,.mapcol,.tabs-m,.daystrip,.fab,.no-print,.stop-tools,.stop-links,.adder,.att,.toast,.day-actions{display:none!important}
  .app{display:block;height:auto}.content{overflow:visible}
  .panel{display:none!important} #p-itinerary{display:block!important}
  .day-body{display:block!important} .stop{break-inside:avoid;box-shadow:none}
  body.hide-recs .stop.rec{display:none}
}
</style>
</head>
<body>
<div id="gate" hidden><form id="gateForm" autocomplete="off"><input id="who" aria-label="Name" placeholder="name" autocomplete="username" autocapitalize="off" spellcheck="false"><input id="pw" type="password" aria-label="Passcode" placeholder="·····" autocomplete="current-password"><button hidden></button></form></div>

<div class="app" id="app" hidden>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="content" id="content">
    <div class="tabs-m" id="tabsM" role="tablist"></div>
    <div class="wrap">
      <section class="panel" id="p-overview"></section>
      <section class="panel" id="p-itinerary"></section>
      <section class="panel" id="p-places"></section>
      <section class="panel" id="p-reservations"></section>
      <section class="panel" id="p-budget"></section>
      <section class="panel" id="p-files"></section>
      <section class="panel" id="p-notes"></section>
    </div>
  </main>
  <aside class="mapcol" id="mapcol">
    <div id="map"></div>
    <div class="map-tools no-print">
      <select id="mapDay" aria-label="Show day on map"></select>
      <button class="btn" id="fitWorld">🌍 World</button>
      <button class="btn" id="saveTiles">⬇ Save offline</button>
      <button class="btn primary map-close" id="mapClose">☰ Back to list</button>
    </div>
  </aside>
  <button class="fab no-print" id="fab">🗺 Map</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" multiple hidden>
<input type="file" id="importPick" accept="application/json,.json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(ENC.iv) }, key, ub64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function matchUser(data, name) {
  const n = String(name || '').trim().toLowerCase();
  return n.length >= 2 ? (data.users || []).find(u => u.toLowerCase() === n || u.toLowerCase().startsWith(n)) : null;
}
function launch(data, key, user) {
  window.TRIP = data; window.TRIP_KEY = key; window.ME = user;
  try { localStorage.setItem('sa26:user', user); } catch {}
  document.getElementById('gate').remove();
  document.getElementById('app').hidden = false;
  document.title = data.title;
  startApp();
}
addEventListener('DOMContentLoaded', async () => {
  const gate = document.getElementById('gate'), inp = document.getElementById('pw'), who = document.getElementById('who');
  let known = null; // remembered key + data, but no user chosen yet
  try {
    const raw = localStorage.getItem(LOCK_KEY);
    if (raw) {
      const k = await crypto.subtle.importKey('raw', ub64(raw), 'AES-GCM', false, ['decrypt']), data = await openWith(k);
      const u = matchUser(data, localStorage.getItem('sa26:user'));
      if (u) return launch(data, k, u);
      known = { data, k }; inp.hidden = true;
    }
  } catch { try { localStorage.removeItem(LOCK_KEY); } catch {} }
  gate.hidden = false; who.focus();
  const no = () => { gate.classList.remove('no'); void gate.offsetWidth; gate.classList.add('no'); };
  document.getElementById('gateForm').onsubmit = async e => {
    e.preventDefault();
    if (!known && !inp.value) { inp.focus(); return; }
    inp.disabled = who.disabled = true;
    try {
      let k, data;
      if (known) ({ k, data } = known); else { k = await deriveKey(inp.value); data = await openWith(k); }
      const u = matchUser(data, who.value);
      if (!u) { inp.disabled = who.disabled = false; who.value = ''; who.focus(); return no(); }
      if (!known) try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', k)); localStorage.setItem(LOCK_KEY, btoa(String.fromCharCode(...raw))); } catch {}
      launch(data, k, u);
    } catch {
      inp.disabled = who.disabled = false; inp.value = ''; inp.focus(); no();
    }
  };
});
function lockTrip() { try { localStorage.removeItem(LOCK_KEY); localStorage.removeItem('sa26:user'); } catch {} location.reload(); }
</script>

<script>
function startApp() {
/* ======================================================================
   Helpers & state
   ====================================================================== */
const Q = new URLSearchParams(location.search);
const PRIVATE = Q.get('private') === '1';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('sa26:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sa26:' + k, JSON.stringify(v)); } catch {} }
};
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000); };
const ICON = { garden: '🌿', flight: '✈️', lodging: '🛏️', car: '🚗', transfer: '🚐', activity: '🎟️', safari: '🦁', food: '🍽️', idea: '💡', info: 'ℹ️', place: '📍', sight: '📍' };
const DAY_COLORS = ['#ff5a36','#2f6fde','#1f9d6b','#b04fd1','#e0a100','#0f9fb0','#d6336c','#5c7cfa','#2b8a3e','#e8590c','#7048e8','#1098ad','#c2255c','#495057','#f08c00'];
const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const shortDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
const gm = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
const dir = (lat, lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
const tel = n => n.replace(/[^\d+]/g, '');
const copy = t => navigator.clipboard?.writeText(t).then(() => toast('Copied ' + t), () => toast(t));

/* Merge Claude's recommendations into each day (marked status:'claude'). */
(TRIP.recommendations || []).slice().reverse().forEach(r => {
  const d = TRIP.days.find(x => x.date === r.date); if (!d) return;
  const at = r.after == null ? d.stops.length : r.after + 1;
  d.stops.splice(at, 0, { type: 'idea', status: 'claude', time: r.time, title: r.title, place: r.place, note: r.note });
});
TRIP.days.forEach((d, i) => d.color = DAY_COLORS[i % DAY_COLORS.length]);

/* Your edits (added stops, order, saved places, expenses) live on this device. */
const uid = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const E = Object.assign({ stops: {}, order: {}, orderAt: {}, places: [], expenses: [], log: [], deleted: [], todoDone: {}, todoExtra: [], notes: { text: '', by: '', at: 0 } }, store.get('edits', {}));
/* migrate older on-device data */
E.places.forEach(p => p.id ||= uid()); E.expenses.forEach(x => x.id ||= uid());
if (!E.todoExtra.length && store.get('todoExtra', null)) { E.todoExtra = store.get('todoExtra', []); }
const oldDone = store.get('todoDone', null); if (oldDone && !Object.keys(E.todoDone).length) Object.entries(oldDone).forEach(([k, v]) => E.todoDone[k] = { v: !!v, by: '', at: 0 });
if (!E.notes.text && store.get('notes', '')) E.notes = { text: store.get('notes', ''), by: '', at: 0 };
const saveE = () => store.set('edits', E);
const now = () => Date.now();
const ago = t => { if (!t) return ''; const m = Math.round((now() - t) / 6e4); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
const userColor = u => (TRIP.travelers.find(t => t.name.startsWith(u)) || {}).color || '#6b7280';
const byTag = (u, t, verb = 'Added') => u ? `<span class="by"><i style="background:${userColor(u)}"></i>${verb} by ${esc(u)}${t ? ' · ' + ago(t) : ''}</span>` : '';
function logAct(action, detail) { E.log.push({ id: uid(), at: now(), by: ME, action, detail }); if (E.log.length > 800) E.log = E.log.slice(-800); saveE(); renderActivity(); }
const dayLabel = di => `Day ${di + 1} (${shortDate(TRIP.days[di].date)})`;
const DOCS = TRIP.docs || [];

const posOf = s => s.lat != null ? { lat: s.lat, lng: s.lng, name: s.addr || s.title } : TRIP.places[s.place] || null;

/* Combined, ordered stops for a day. */
function dayStops(di) {
  const d = TRIP.days[di];
  const list = [...d.stops.map((s, i) => ({ ...s, key: 'b' + i })), ...(E.stops[d.date] || []).map(s => ({ ...s, key: s.id, user: true }))];
  const ord = E.order[d.date];
  if (ord) list.sort((a, b) => { const ia = ord.indexOf(a.key), ib = ord.indexOf(b.key); return (ia < 0 ? 1e3 + list.indexOf(a) : ia) - (ib < 0 ? 1e3 + list.indexOf(b) : ib); });
  let n = 0; list.forEach(s => { s._n = posOf(s) && s.status !== 'claude' ? ++n : null; });
  return list;
}
const km = (a, b) => { const R = 6371, t = Math.PI / 180, dLa = (b.lat - a.lat) * t, dLo = (b.lng - a.lng) * t;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
function estimate(a, b) {
  const d = km(a, b);
  if (d < 0.3) return '📍 Same area';
  if (d > 400) return `✈️ ~${Math.round(d).toLocaleString()} km`;
  const road = d * 1.3, mins = Math.round(road / (road < 15 ? 35 : 65) * 60);
  if (road < 1.5) return `🚶 ~${Math.max(2, Math.round(road / 4.8 * 60))} min walk`;
  return `🚗 ~${mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + ' min'} · ${road.toFixed(road < 10 ? 1 : 0)} km`;
}

/* ======================================================================
   Navigation
   ====================================================================== */
const SECTIONS = [['overview', '🏠', 'Overview'], ['itinerary', '🗓️', 'Itinerary'], ['places', '⭐', 'Places to visit'], ['reservations', '🎫', 'Reservations'],
  ['budget', '💰', 'Budget'], ['files', '📎', 'Files'], ['notes', '✅', 'Notes & to-do']].filter(([id]) => !(PRIVATE && (id === 'budget' || id === 'files')));
let current = 'itinerary';
function renderNav() {
  $('#nav').innerHTML = `<div class="brand"><img src="icon.svg" alt=""><b>${esc(TRIP.title)}</b></div>` +
    SECTIONS.map(([id, ic, l]) => `<button class="nav-item ${id === current ? 'active' : ''}" data-go="${id}"><span class="ic">${ic}</span>${l}</button>` +
      (id === 'itinerary' ? `<div class="nav-days">${TRIP.days.map((d, i) => `<button class="nav-day" data-day="${i}"><i style="background:${d.color}"></i>${shortDate(d.date)}</button>`).join('')}</div>` : '')).join('') +
    `<div class="nav-foot no-print">
      <button class="nav-item" id="icsBtn"><span class="ic">📅</span>Add to calendar</button>
      <button class="nav-item" id="printBtn"><span class="ic">🖨️</span>Print itinerary</button>
      <div class="me"><span class="avatar" style="background:${userColor(ME)};width:26px;height:26px;margin:0">${esc(ME[0])}</span><span>Signed in as <b>${esc(ME)}</b><br><a href="#" id="switchUser" class="small">Switch to ${esc(TRIP.users.find(u => u !== ME) || '')}</a></span></div>
      <button class="nav-item" onclick="lockTrip()"><span class="ic">🔒</span>Lock</button>
      <div class="small muted" style="padding:6px 10px" id="net"></div></div>`;
  $('#tabsM').innerHTML = SECTIONS.map(([id, ic, l]) => `<button class="${id === current ? 'active' : ''}" data-go="${id}">${ic} ${l}</button>`).join('');
  $('#switchUser').onclick = e => { e.preventDefault(); const o = TRIP.users.find(u => u !== ME); if (o && confirm(`Switch to ${o} on this device?`)) { try { localStorage.setItem('sa26:user', o); } catch {} location.reload(); } };
  $('#icsBtn').onclick = exportICS; $('#printBtn').onclick = () => { showTab('itinerary'); $$('.day').forEach(d => d.classList.add('open')); setTimeout(print, 100); };
  net();
}
function showTab(id) {
  if (!SECTIONS.some(t => t[0] === id)) id = 'itinerary';
  current = id;
  $$('[data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === id));
  $$('.panel').forEach(p => p.hidden = p.id !== 'p-' + id);
  if (location.hash !== '#' + id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
  $('#content').scrollTop = 0; if (innerWidth <= 960) scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { showTab(g.dataset.go); return; }
  const d = e.target.closest('[data-day]'); if (d) { jumpDay(+d.dataset.day); }
});
function jumpDay(di) {
  showTab('itinerary');
  const el = $(`.day[data-d="${di}"]`); if (!el) return;
  el.classList.add('open'); saveOpen();
  const top = el.getBoundingClientRect().top + (innerWidth <= 960 ? scrollY - 110 : $('#content').scrollTop - 10);
  (innerWidth <= 960 ? window : $('#content')).scrollTo({ top, behavior: 'smooth' });
  focusDay(di);
}

/* ======================================================================
   Map
   ====================================================================== */
let map = null, mapLayer = null, markers = {}, focusDayIdx = -1, fittedOnce = false;
function initMap() {
  if (typeof L === 'undefined') { $('#map').innerHTML = '<div style="padding:24px" class="muted">Map unavailable offline until it has been loaded once online.</div>'; return; }
  map = L.map('map', { zoomControl: true, worldCopyJump: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  mapLayer = L.layerGroup().addTo(map);
  $('#mapDay').innerHTML = `<option value="-1">All days</option>` + TRIP.days.map((d, i) => `<option value="${i}">Day ${i + 1} · ${shortDate(d.date)}</option>`).join('') + `<option value="saved">⭐ Places to visit</option>`;
  $('#mapDay').onchange = e => { const v = e.target.value; if (v === 'saved') return fitSaved(); focusDay(+v); };
  $('#fitWorld').onclick = () => map.fitBounds(Object.values(TRIP.places).map(p => [p.lat, p.lng]), { padding: [30, 30] });
  renderMap(); fitSA();
}
function pinIcon(cls, color, label) {
  return L.divIcon({ className: cls === 'rec' ? 'rec-pin' : '', html: `<div class="pin ${cls} ${focusDayIdx >= 0 && cls !== 'saved' ? '' : ''}" style="${cls === 'rec' ? 'border-color:' + color : cls === 'saved' ? '' : 'background:' + color}"><span>${label}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });
}
function renderMap() {
  if (!map) return; mapLayer.clearLayers(); markers = {};
  TRIP.days.forEach((d, di) => {
    const pts = [], dim = focusDayIdx >= 0 && focusDayIdx !== di;
    dayStops(di).forEach(s => {
      const p = posOf(s); if (!p) return;
      const rec = s.status === 'claude';
      if (!rec && !p.world) pts.push([p.lat, p.lng]);
      const m = L.marker([p.lat, p.lng], { icon: pinIcon(rec ? 'rec' : '', d.color, rec ? '✨' : s._n), opacity: dim ? .3 : 1, zIndexOffset: dim ? -500 : 0 })
        .bindPopup(`${rec ? '<span style="color:#6a4fc4;font-size:11px;font-weight:700">✨ CLAUDE RECOMMENDS</span><br>' : ''}<b>${esc(s.title)}</b><br><span style="color:#888">Day ${di + 1} · ${fmtDate(d.date)}${s.time ? ' · ' + esc(s.time) : ''}</span><br>${esc(p.name || '')}<br><a href="${dir(p.lat, p.lng)}" target="_blank" rel="noopener">Directions ↗</a>`);
      m.on('click', () => selectStop(di, s.key, false));
      m.addTo(mapLayer); markers[di + ':' + s.key] = m;
    });
    if (pts.length > 1) L.polyline(pts, { color: d.color, weight: dim ? 2 : 3.5, opacity: dim ? .2 : .85, dashArray: '6 7' }).addTo(mapLayer);
  });
  E.places.forEach(p => {
    L.marker([p.lat, p.lng], { icon: pinIcon('saved', '', '★') }).bindPopup(`<span style="color:#6b7280;font-size:11px;font-weight:700">⭐ PLACES TO VISIT</span><br><b>${esc(p.name)}</b><br>${esc(p.addr || '')}<br><a href="${dir(p.lat, p.lng)}" target="_blank" rel="noopener">Directions ↗</a>`).addTo(mapLayer);
  });
}
function fitSA() { if (!map) return; const pts = Object.values(TRIP.places).filter(p => !p.world).map(p => [p.lat, p.lng]); map.fitBounds(pts, { padding: [40, 40] }); }
function fitSaved() { if (!map || !E.places.length) return toast('No saved places yet'); map.fitBounds(E.places.map(p => [p.lat, p.lng]), { padding: [50, 50], maxZoom: 13 }); }
function focusDay(di) {
  focusDayIdx = di; if (!map) return;
  $('#mapDay').value = String(di); renderMap();
  if (di < 0) return fitSA();
  const pts = dayStops(di).map(posOf).filter(Boolean).map(p => [p.lat, p.lng]);
  if (!pts.length) return;
  pts.length === 1 ? map.setView(pts[0], 12) : map.fitBounds(pts, { padding: [50, 50], maxZoom: 13 });
}
function selectStop(di, key, pan = true) {
  $$('.stop.sel').forEach(e => e.classList.remove('sel'));
  const el = $(`.stop[data-d="${di}"][data-k="${key}"]`);
  if (el) { el.classList.add('sel'); el.closest('.day').classList.add('open'); if (!pan) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  const s = dayStops(di).find(x => x.key === key), p = s && posOf(s);
  if (focusDayIdx !== di) { focusDayIdx = di; if (map) { $('#mapDay').value = String(di); renderMap(); } }
  if (map && p) { if (pan) map.setView([p.lat, p.lng], Math.max(map.getZoom(), 13)); markers[di + ':' + key]?.openPopup(); }
  if (pan && p && innerWidth <= 960) setMap(true);
}
function setMap(on) { $('#app').classList.toggle('show-map', on); setTimeout(() => { if (!map) return; map.invalidateSize(); if (on && !fittedOnce) { fittedOnce = true; focusDayIdx >= 0 ? focusDay(focusDayIdx) : fitSA(); } }, 280); }
$('#fab').onclick = () => setMap(true); $('#mapClose').onclick = () => setMap(false);

$('#saveTiles').onclick = async () => {
  if (!('caches' in window)) return toast('Offline storage not supported');
  const lon2x = (lng, z) => Math.floor((lng + 180) / 360 * 2 ** z);
  const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); };
  const urls = new Set();
  for (let z = 5; z <= 7; z++) for (let x = lon2x(17.5, z); x <= lon2x(32, z); x++) for (let y = lat2y(-23.5, z); y <= lat2y(-35, z); y++) urls.add(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
  [...Object.values(TRIP.places).filter(p => !p.world), ...E.places, ...Object.values(E.stops).flat()].forEach(p => {
    if (p.lat == null) return;
    for (let z = 9; z <= 14; z++) { const cx = lon2x(p.lng, z), cy = lat2y(p.lat, z), r = z >= 13 ? 1 : 0;
      for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) urls.add(`https://tile.openstreetmap.org/${z}/${cx + dx}/${cy + dy}.png`); }
  });
  const c = await caches.open('sa-tiles'), list = [...urls], btn = $('#saveTiles'); let done = 0; btn.disabled = true;
  for (let i = 0; i < list.length; i += 4) {
    await Promise.all(list.slice(i, i + 4).map(async u => { try { if (!(await c.match(u))) await c.put(u, await fetch(u, { mode: 'no-cors' })); } catch {} done++; }));
    btn.textContent = `⬇ ${Math.round(done / list.length * 100)}%`;
  }
  btn.textContent = '✓ Saved offline'; btn.disabled = false; toast(`Saved ${list.length} map tiles for offline use`);
};

/* ======================================================================
   Place search (trip places + saved places + OpenStreetMap)
   ====================================================================== */
function attachSearch(input, onPick) {
  const box = document.createElement('div'); box.className = 'results'; box.hidden = true; input.parentElement.appendChild(box);
  let items = [], hl = -1, timer, seq = 0;
  const draw = () => { box.hidden = !items.length; box.innerHTML = items.map((r, i) => `<button type="button" class="result ${i === hl ? 'hl' : ''}" data-i="${i}"><b>${esc(r.name)}</b><span>${esc(r.addr || '')}</span></button>`).join(''); };
  const local = q => {
    const ql = q.toLowerCase(), seen = new Set();
    return [...Object.values(TRIP.places).map(p => ({ ...p, addr: 'In your trip' })), ...E.places.map(p => ({ ...p, addr: '⭐ ' + (p.addr || 'Saved place') }))]
      .filter(p => p.name.toLowerCase().includes(ql) && !seen.has(p.name) && seen.add(p.name)).slice(0, 4);
  };
  input.addEventListener('input', () => {
    const q = input.value.trim(); clearTimeout(timer); hl = -1;
    if (q.length < 2) { items = []; return draw(); }
    items = local(q); draw();
    if (!navigator.onLine) return;
    const my = ++seq;
    timer = setTimeout(async () => {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=za&q=${encodeURIComponent(q)}`, { headers: { 'Accept-Language': 'en' } });
        const js = await r.json(); if (my !== seq) return;
        items = [...local(q), ...js.map(x => ({ name: x.name || x.display_name.split(',')[0], addr: x.display_name.split(',').slice(1, 4).join(',').trim(), lat: +x.lat, lng: +x.lon }))];
        if (!items.length) items = [{ name: `Add “${q}” without a map pin`, addr: 'No match found', custom: q }];
        draw();
      } catch {}
    }, 450);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { hl = Math.min(items.length - 1, hl + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hl = Math.max(0, hl - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); const q = input.value.trim(); if (items[hl >= 0 ? hl : 0]) pick(items[hl >= 0 ? hl : 0]); else if (q) pick({ name: q, custom: q }); }
    else if (e.key === 'Escape') { items = []; draw(); }
  });
  input.addEventListener('blur', () => setTimeout(() => { items = []; draw(); }, 200));
  box.addEventListener('mousedown', e => { const b = e.target.closest('[data-i]'); if (b) { e.preventDefault(); pick(items[+b.dataset.i]); } });
  function pick(r) { const v = r.custom ? { name: r.custom } : { name: r.name, addr: r.addr === 'In your trip' ? '' : (r.addr || '').replace(/^⭐ /, ''), lat: r.lat, lng: r.lng };
    input.value = ''; items = []; draw(); onPick(v); }
}

/* ======================================================================
   Itinerary
   ====================================================================== */
const openSet = () => new Set(store.get('openDays2', null) ?? TRIP.days.map((_, i) => i));
const saveOpen = () => store.set('openDays2', $$('.day.open').map(e => +e.dataset.d));
const todayIndex = () => { const t = new Date().toLocaleDateString('en-CA'); return TRIP.days.findIndex(d => d.date === t); };
let editing = null; // "di:key"

function stopHTML(d, di, s, list, idx) {
  const p = posOf(s), r = TRIP.reservations.find(x => x.id === s.res), rec = s.status === 'claude';
  const badge = s.status === 'pending' ? ' <span class="badge b-pending">Pending</span>' : s.status === 'idea' ? ' <span class="badge b-idea">Idea</span>' : rec ? ' <span class="badge b-rec">✨ Claude recommends</span>' : s.user ? ' <span class="badge b-you">Added</span>' : '';
  const conf = r?.conf && !PRIVATE ? ` · <span class="conf" data-copy="${esc(r.conf)}">${esc(r.conf)}</span>` : '';
  const ed = editing === di + ':' + s.key;

  let p; const open = () => p ||= new Promise((res, rej) => { const r = indexedDB.open('sa26-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const out = fn(t.objectStore('files')); t.oncomplete = () => res(out.result ?? out); t.onerror = () => rej(t.error); }); };
  return { all: () => tx('readonly', s => s.getAll()), add: f => tx('readwrite', s => s.add(f)), del: id => tx('readwrite', s => s.delete(id)), get: id => tx('readonly', s => s.get(id)) };
})();

function budgetCalc() {
  const items = allItems(), by = s => items.filter(b => b.status === s), sum = (a, k) => a.reduce((t, b) => t + (b[k] || 0), 0);
  const paid = by('paid'), owed = by('owed');
  const cats = Object.keys(CATS).map(c => [c, items.filter(b => b.cat === c).reduce((a, b) => a + usdOf(b), 0)]).filter(([c, v]) => v > 0 || ['Flights', 'Lodging', 'Activities', 'Transport'].includes(c));
  const total = cats.reduce((a, [, v]) => a + v, 0), pts = {};

    paidTot: paid.reduce((a, b) => a + usdOf(b), 0), owedTot: owed.reduce((a, b) => a + usdOf(b), 0), cats, total, pts, redeemedZar: sum(items, 'valueZar') };
}
function donut(cats, total) {

    const d = `M ${P(a, R)} A ${R} ${R} 0 ${large} 1 ${P(a2, R)} L ${P(a2, r)} A ${r} ${r} 0 ${large} 0 ${P(a, r)} Z`; a += ang;
    return `<path d="${d}" fill="${CATS[c]}" stroke="#fff" stroke-width="2"><title>${c}: ${fUSD(v)}</title></path>`; }).join('');
  return `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Spending by category">${arcs}
    <text x="90" y="86" text-anchor="middle" font-size="11" fill="#6b7280">Total</text><text x="90" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#1c2430">$${Math.round(total).toLocaleString()}</text></svg>`;
}

/* Merge another device's edits into ours: union by id, deletions win, newest edit wins. */
function mergeEdits(o) {
  const del = new Set([...(E.deleted || []), ...(o.deleted || [])]);
  const before = E.log.length;
  const byId = (a, b, newer = (x, y) => (x.upd || x.at || 0) >= (y.upd || y.at || 0)) => {
    const m = new Map(); [...a, ...b].forEach(x => { if (!x || !x.id || del.has(x.id)) return; const c = m.get(x.id); if (!c || newer(x, c)) m.set(x.id, x); }); return [...m.values()];
  };
  const dates = new Set([...Object.keys(E.stops), ...Object.keys(o.stops || {})]);
  dates.forEach(d => E.stops[d] = byId(E.stops[d] || [], (o.stops || {})[d] || []));
  Object.entries(o.order || {}).forEach(([d, ord]) => { if ((o.orderAt?.[d] || 0) > (E.orderAt[d] || 0)) { E.order[d] = ord; E.orderAt[d] = o.orderAt[d]; } });
  E.places = byId(E.places, o.places || []);
  E.expenses = byId(E.expenses, o.expenses || []);
  E.todoExtra = byId(E.todoExtra, o.todoExtra || []);
  Object.entries(o.todoDone || {}).forEach(([k, v]) => { if (!E.todoDone[k] || (v.at || 0) > (E.todoDone[k].at || 0)) E.todoDone[k] = v; });
  if ((o.notes?.at || 0) > (E.notes.at || 0)) E.notes = o.notes;
  const seen = new Set(E.log.map(x => x.id)); (o.log || []).forEach(x => { if (!seen.has(x.id)) E.log.push(x); });
  E.log.sort((a, b) => a.at - b.at);
  E.deleted = [...del];
  return E.log.length - before;
}

   ====================================================================== */
async function openDoc(id) {
  const w = window.open('', '_blank');
  try {
    const buf = new Uint8Array(await (await fetch(`docs/${id}.enc`)).arrayBuffer());
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, TRIP_KEY, buf.subarray(12));
    const url = URL.createObjectURL(new Blob([pt], { type: 'application/pdf' }));
    if (w) w.location.href = url; else location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch { w?.close(); toast(navigator.onLine ? 'Could not open that document' : 'Open this document once online to save it offline'); }
}
const docsFor = id => DOCS.filter(d => d.res === id);
const docPills = list => list.map(d => `<span class="doc-pill" data-doc="${d.id}">🎫 ${esc(d.title)}</span>`).join(' ');
document.addEventListener('click', e => { const d = e.target.closest('[data-doc]'); if (d) { e.preventDefault(); openDoc(d.dataset.doc); } });

    const desc = [s.note, !PRIVATE && r?.conf ? 'Conf ' + r.conf : ''].filter(Boolean).join(' — ');
    lines.push('BEGIN:VEVENT', `UID:${d.date}-${s.key}@trip`, 'DTSTAMP:20261101T000000Z', m ? `DTSTART:${pad(d.date)}T${m[1]}${m[2]}00` : `DTSTART;VALUE=DATE:${pad(d.date)}`,
      m ? 'DURATION:PT1H' : 'DURATION:P1D', `SUMMARY:${x(s.title)}`, desc && `DESCRIPTION:${x(desc)}`, p && `LOCATION:${x(p.name || s.addr || '')}`, 'END:VEVENT');
  }));
  lines.push('END:VCALENDAR');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.filter(Boolean).join('\r\n')], { type: 'text/calendar' })); a.download = 'trip.ics'; a.click(); toast('Calendar file downloaded');
}
function net() { const n = $('#net'); if (n) n.innerHTML = navigator.onLine ? '● Online · saved for offline' : '<span style="color:var(--warn)">● Offline — saved copy</span>'; }
addEventListener('online', net); addEventListener('offline', net);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

document.body.classList.toggle('hide-recs', !store.get('recs', true));
renderNav(); initMap(); renderOverview(); renderItinerary(); renderPlaces(); renderReservations(); renderBudget(); renderFiles(); renderNotes();
prefetchDocs();
showTab(location.hash.slice(1) || 'itinerary');
addEventListener('hashchange', () => showTab(location.hash.slice(1)));
}
