<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f4d3a">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f7f1e6; --card:#fffdf8; --ink:#1d2a24; --muted:#6b736c; --line:#e6dccb;
  --green:#1f4d3a; --green-soft:#e2ece5; --orange:#e8743b; --orange-soft:#fbe6da;
  --sand:#efe4cf; --ok:#2e7d4f; --warn:#c97a12; --bad:#b9412f; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 16px rgba(40,30,10,.06);
  --r:16px; --rec:#6a4fc4; --rec-bg:#f1edfc; --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --card:#1c2420; --ink:#ece6da; --muted:#9aa39c; --line:#2c3631;
  --green:#7cc49d; --green-soft:#21352b; --orange:#f0915e; --orange-soft:#3b281e; --sand:#2a2a22;
  --ok:#6cc58d; --warn:#e3a54a; --bad:#e87a66; --shadow:0 1px 2px rgba(0,0,0,.3); --rec:#9b86ec; --rec-bg:#25213a;
}}
:root[data-theme="dark"]{
  --bg:#141a17; --card:#1c2420; --ink:#ece6da; --muted:#9aa39c; --line:#2c3631;
  --green:#7cc49d; --green-soft:#21352b; --orange:#f0915e; --orange-soft:#3b281e; --sand:#2a2a22;
  --ok:#6cc58d; --warn:#e3a54a; --bad:#e87a66; --shadow:0 1px 2px rgba(0,0,0,.3); --rec:#9b86ec; --rec-bg:#25213a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
a{color:var(--green)}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,46%);min-height:100vh}
.left{padding:0 28px 80px;min-width:0}
.right{position:sticky;top:0;height:100vh;border-left:1px solid var(--line)}
#map{height:100%;width:100%;background:var(--sand)}
.map-tools{position:absolute;z-index:500;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.chip-btn:hover{border-color:var(--green)}
.chip-btn.primary{background:var(--green);color:var(--bg);border-color:var(--green)}
/* hero */
.hero{padding:28px 0 8px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
h1{font-size:34px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em}
.dates{color:var(--muted);font-weight:500}
.avatars{display:flex}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;border:3px solid var(--bg);margin-left:-8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip b{color:var(--green)}
.status-line{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok);margin-right:4px}
.dot.off{background:var(--warn)}
/* tabs */
.tabs{position:sticky;top:0;z-index:600;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green);color:var(--bg)}
.panel{display:none}.panel.active{display:block}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
h2{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.b-paid{background:var(--green-soft);color:var(--ok)}
.b-owed{background:var(--orange-soft);color:var(--orange)}
.b-pending{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .b-pending{background:#3a3016;color:#e9c46a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-pending{background:#3a3016;color:#e9c46a}}
.b-idea{background:var(--sand);color:var(--muted)}
.b-points{background:#e7e3fb;color:#4a3fa3}
:root[data-theme="dark"] .b-points{background:#2a2840;color:#b7aef7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-points{background:#2a2840;color:#b7aef7}}
.flag{background:var(--orange-soft);border-left:3px solid var(--orange);padding:6px 10px;border-radius:8px;font-size:13px;margin-top:6px}
/* days */
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.day-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;width:100%;border:0;background:transparent;text-align:left}
.day-swatch{width:12px;height:36px;border-radius:6px;flex:none}
.day-title{font-weight:700;font-size:16px}
.day-sub{font-size:13px;color:var(--muted)}
.chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.day.open .chev{transform:rotate(90deg)}
.day-body{display:none;padding:0 16px 14px}
.day.open .day-body{display:block}
.day.today{outline:2px solid var(--orange)}
.stop{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer}
.stop:hover{background:var(--bg)}
.stop.sel{background:var(--green-soft)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.num.nomap{background:var(--line)!important;color:var(--muted)}
.stop-title{font-weight:650}
.stop-time{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.stop-note{font-size:13px;color:var(--muted);margin-top:2px}
.stop-links{display:flex;gap:10px;margin-top:4px;font-size:12px;font-weight:600}
.stop-links a{text-decoration:none}
.conn{display:flex;align-items:center;gap:8px;margin-left:22px;padding:2px 0 2px 26px;border-left:2px dashed var(--line);font-size:12px;color:var(--muted)}
/* reservations */
.res-head{display:flex;gap:12px;align-items:flex-start}
.res-icon{font-size:22px;width:44px;height:44px;border-radius:12px;background:var(--sand);display:grid;place-items:center;flex:none}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0;font-size:13px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
.conf{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sand);padding:1px 6px;border-radius:6px;cursor:copy}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.att{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file-pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--bg);cursor:pointer}
/* budget */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:19px;white-space:nowrap;font-weight:800;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bar{height:14px;border-radius:999px;background:var(--orange-soft);overflow:hidden;display:flex}
.bar span{background:var(--green);display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate input{width:90px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
/* todo */
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line)}
.todo input{margin-top:4px;width:18px;height:18px;accent-color:var(--green)}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo .del{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input,textarea{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{width:100%;min-height:140px;resize:vertical}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--green);background:var(--green-soft)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;z-index:2000;pointer-events:none}
.toast.show{opacity:1}
.map-toggle{display:none}
.leaflet-container{font-family:var(--font)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:11px}
.stop.rec{background:var(--rec-bg);border:1px dashed var(--rec);margin:4px 0}
.stop.rec:hover{background:var(--rec-bg)}
.stop.rec .stop-note{color:var(--ink);opacity:.85}
.recnum{background:var(--rec-bg);border:1.5px dashed var(--rec);font-size:13px}
.b-rec{background:var(--rec);color:#fff;text-transform:none;letter-spacing:0}
.pin.rec{background:#fff;border-width:3px;width:24px;height:24px}
.pin.rec span{font-size:11px}
body.hide-recs .stop.rec, body.hide-recs .rec-pin{display:none!important}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
#gate[hidden]{display:none}
#pw{width:150px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;text-align:center;letter-spacing:.2em;outline:none;color:var(--muted)}
#pw:focus{border-color:var(--muted)}
#gate.no #pw{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.app[hidden]{display:none}
.search{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin-bottom:12px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .right{position:relative;height:0;overflow:hidden;border:0;order:-1;transition:height .25s}
  .app.show-map .right{height:46vh;border-bottom:1px solid var(--line)}
  .left{padding:0 16px 80px}
  .map-toggle{display:inline-block}
  h1{font-size:27px}
  .hero{padding-top:18px}
}
@media print{
  .right,.tabs,.map-tools,.no-print,.stop-links,.att,.toast{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000;font-size:12px}
  .panel{display:none!important}
  #p-itinerary{display:block!important}
  .day{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .day-body{display:block!important}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<div id="gate" hidden><form id="gateForm" autocomplete="off"><input id="pw" type="password" aria-label="Passcode" placeholder="·····" autocomplete="current-password"></form></div>
<div class="app" id="app" hidden>
  <main class="left">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">Trip itinerary</div>
          <h1 id="title"></h1>
          <div class="dates" id="dates"></div>
        </div>
        <div class="avatars" id="avatars"></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="status-line no-print">
        <span id="net"></span>
        <button class="chip-btn map-toggle" id="mapToggle">🗺 Show map</button>
        <button class="chip-btn" id="themeBtn" title="Toggle light/dark">◐ Theme</button>
        <button class="chip-btn" id="printBtn">🖨 Print</button>
        <button class="chip-btn" id="icsBtn">📅 Add to calendar</button>
        <button class="chip-btn" onclick="lockTrip()" title="Lock and forget this device">🔒 Lock</button>
      </div>
    </header>
    <nav class="tabs" role="tablist" id="tabs"></nav>

    <section class="panel" id="p-overview"></section>
    <section class="panel" id="p-itinerary"></section>
    <section class="panel" id="p-reservations"></section>
    <section class="panel" id="p-budget"></section>
    <section class="panel" id="p-files"></section>
    <section class="panel" id="p-notes"></section>
  </main>
  <aside class="right">
    <div id="map"></div>
    <div class="map-tools no-print">
      <button class="chip-btn" id="fitAll">Fit trip</button>
      <button class="chip-btn" id="fitWorld">🌍 World</button>
      <button class="chip-btn primary" id="saveTiles">⬇ Save map offline</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" multiple hidden>

const LOCK_KEY = 'sa26:k';
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(ENC.iv) }, key, ub64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function launch(data) {
  window.TRIP = data;
  document.getElementById('gate').remove();
  document.getElementById('app').hidden = false;
  document.title = data.title;
  startApp();
}
addEventListener('DOMContentLoaded', async () => {
  const gate = document.getElementById('gate'), inp = document.getElementById('pw');
  try { // remembered device
    const raw = localStorage.getItem(LOCK_KEY);
    if (raw) { const k = await crypto.subtle.importKey('raw', ub64(raw), 'AES-GCM', false, ['decrypt']); return launch(await openWith(k)); }
  } catch { try { localStorage.removeItem(LOCK_KEY); } catch {} }
  gate.hidden = false; inp.focus();
  document.getElementById('gateForm').onsubmit = async e => {
    e.preventDefault(); inp.disabled = true;
    try {
      const k = await deriveKey(inp.value), data = await openWith(k);
      try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', k)); localStorage.setItem(LOCK_KEY, btoa(String.fromCharCode(...raw))); } catch {}
      launch(data);
    } catch {
      inp.disabled = false; inp.value = ''; inp.focus();
      gate.classList.remove('no'); void gate.offsetWidth; gate.classList.add('no');
    }
  };
});
function lockTrip() { try { localStorage.removeItem(LOCK_KEY); } catch {} location.reload(); }
</script>

function startApp() {
/* ===================================================================== */
const Q = new URLSearchParams(location.search);
const PRIVATE = Q.get('private') === '1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('sa26:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sa26:' + k, JSON.stringify(v)); } catch {} }
};
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); };
const ICON = { garden: '🌿', flight: '✈️', lodging: '🛏️', car: '🚗', transfer: '🚐', activity: '📸', photo: '📸', safari: '🦁', food: '🍽️', idea: '💡', info: 'ℹ️' };
const DAY_COLORS = ['#1f4d3a','#e8743b','#3a7ca5','#b5542a','#7b5ea7','#2f8f6b','#c0392b','#d4a017','#5c7a29','#a0522d','#2b6cb0','#c2185b','#00897b','#6d4c41','#455a64'];
const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const mapsLink = p => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
const dirLink = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
const tel = n => n.replace(/[^\d+]/g, '');
(TRIP.recommendations || []).slice().reverse().forEach(r => {
  const d = TRIP.days.find(x => x.date === r.date); if (!d) return;
  const at = r.after == null ? d.stops.length : r.after + 1;
  d.stops.splice(at, 0, { type: 'idea', status: 'claude', time: r.time, title: r.title, place: r.place, note: r.note });
});
TRIP.days.forEach((d, i) => { d.color = DAY_COLORS[i % DAY_COLORS.length]; let n = 0; d.stops.forEach(s => { if (TRIP.places[s.place] && s.status !== 'claude') s._n = ++n; }); });

/* ---------- header ---------- */
$('#title').textContent = TRIP.title;
$('#dates').textContent = `${fmtDate(TRIP.start)} – ${fmtDate(TRIP.end)}, 2026 · ${TRIP.travelers.map(t => t.name.split(' ')[0]).join(' & ')}`;
$('#avatars').innerHTML = TRIP.travelers.map(t => `<div class="avatar" title="${esc(t.name)}" style="background:${t.color}">${t.initials}</div>`).join('');
const nights = Math.round((new Date(TRIP.end) - new Date(TRIP.start)) / 864e5);
const stays = TRIP.reservations.filter(r => r.kind === 'lodging').length;
const flights = TRIP.days.flatMap(d => d.stops).filter(s => s.type === 'flight' && /→/.test(s.title)).length;
const cars = TRIP.reservations.filter(r => r.kind === 'car').length;
$('#chips').innerHTML = [[nights, 'nights'], [stays, 'stays'], [flights, 'flights'], [cars, 'rental car']]
  .map(([n, l]) => `<span class="chip"><b>${n}</b> ${l}</span>`).join('') + (PRIVATE ? '<span class="chip">🔒 Shared view</span>' : '');

/* ---------- tabs ---------- */
const TABS = [['overview', 'Overview'], ['itinerary', 'Itinerary'], ['reservations', 'Reservations'], ['budget', 'Budget'], ['files', 'Files'], ['notes', 'Notes & To-do']]
  .filter(([id]) => !(PRIVATE && (id === 'budget' || id === 'files')));
function showTab(id) {
  if (!TABS.some(t => t[0] === id)) id = 'itinerary';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + id));
  if (location.hash !== '#' + id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
  if (map) setTimeout(() => map.invalidateSize(), 50);
}
$('#tabs').innerHTML = TABS.map(([id, l]) => `<button class="tab" role="tab" data-tab="${id}">${l}</button>`).join('');
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.tab); });

/* ---------- map ---------- */
let map = null, layers = {}, markers = [];
function initMap() {
  if (typeof L === 'undefined') { $('#map').innerHTML = '<div style="padding:24px" class="muted">Map unavailable offline until it has been loaded once online.</div>'; return; }
  map = L.map('map', { zoomControl: true, worldCopyJump: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  TRIP.days.forEach((d, di) => {
    const g = L.layerGroup(); const pts = [];
    let n = 0;
    d.stops.forEach((s, si) => {
      const p = TRIP.places[s.place]; if (!p) return; const rec = s.status === 'claude'; n = s._n; if (!rec) pts.push([p.lat, p.lng]);
      const icon = L.divIcon({ className: rec ? 'rec-pin' : '', html: rec ? `<div class="pin rec" style="border-color:${d.color}"><span>✨</span></div>` : `<div class="pin" style="background:${d.color}"><span>${n}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });
      const m = L.marker([p.lat, p.lng], { icon }).bindPopup(`${rec ? '<span style="color:#6a4fc4;font-size:11px;font-weight:700">✨ CLAUDE RECOMMENDS</span><br>' : ''}<b>${esc(s.title)}</b><br><span style="color:#888">${fmtDate(d.date)}${s.time ? ' · ' + esc(s.time) : ''}</span><br>${esc(p.name)}<br><a href="${dirLink(p)}" target="_blank" rel="noopener">Directions</a>`);
      m.on('click', () => selectStop(di, si, false));
      m.addTo(g); markers.push({ di, si, m });
    });
    if (pts.length > 1 && !d.stops.some(s => TRIP.places[s.place]?.world)) L.polyline(pts, { color: d.color, weight: 3, opacity: .75, dashArray: '6 6' }).addTo(g);
    g.addTo(map); layers[di] = { g, pts };
  });
  fitSA();
}
function fitSA() { if (!map) return; const pts = Object.values(TRIP.places).filter(p => !p.world).map(p => [p.lat, p.lng]); map.fitBounds(pts, { padding: [30, 30] }); }
function fitWorld() { if (!map) return; map.fitBounds(Object.values(TRIP.places).map(p => [p.lat, p.lng]), { padding: [30, 30] }); }
function fitDay(di) {
  if (!map) return; const pts = layers[di]?.pts; if (!pts?.length) return;
  pts.length === 1 ? map.setView(pts[0], 12) : map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
}
function selectStop(di, si, pan = true) {
  document.querySelectorAll('.stop.sel').forEach(e => e.classList.remove('sel'));
  const el = document.querySelector(`.stop[data-d="${di}"][data-s="${si}"]`);
  if (el) { el.classList.add('sel'); const day = el.closest('.day'); day.classList.add('open'); if (!pan) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  const s = TRIP.days[di].stops[si], p = TRIP.places[s.place];
  if (map && p) { if (pan) map.setView([p.lat, p.lng], Math.max(map.getZoom(), 13)); markers.find(x => x.di === di && x.si === si)?.m.openPopup(); }
  if (pan && p && window.innerWidth <= 900) setMap(true);
}
$('#fitAll').onclick = fitSA; $('#fitWorld').onclick = fitWorld;
function setMap(on) { $('#app').classList.toggle('show-map', on); $('#mapToggle').textContent = on ? '🗺 Hide map' : '🗺 Show map'; setTimeout(() => { if (!map) return; map.invalidateSize(); if (on && !setMap.done) { setMap.done = true; fitSA(); } }, 280); }
$('#mapToggle').onclick = () => setMap(!$('#app').classList.contains('show-map'));

/* Pre-download a modest set of tiles around every pin so the map works offline. */
$('#saveTiles').onclick = async () => {
  if (!('caches' in window)) return toast('Offline storage not supported');
  const lon2x = (lng, z) => Math.floor((lng + 180) / 360 * 2 ** z);
  const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); };
  const urls = new Set();
  for (let z = 5; z <= 7; z++) { // regional overview
    for (let x = lon2x(17.5, z); x <= lon2x(32, z); x++) for (let y = lat2y(-23.5, z); y <= lat2y(-35, z); y++) urls.add(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
  }
  Object.values(TRIP.places).filter(p => !p.world).forEach(p => {
    for (let z = 9; z <= 14; z++) { const cx = lon2x(p.lng, z), cy = lat2y(p.lat, z), r = z >= 13 ? 1 : 0;
      for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) urls.add(`https://tile.openstreetmap.org/${z}/${cx + dx}/${cy + dy}.png`); }
  });
  const c = await caches.open('sa-tiles'); const list = [...urls]; let done = 0;
  const btn = $('#saveTiles'); btn.disabled = true;
  for (let i = 0; i < list.length; i += 4) {
    await Promise.all(list.slice(i, i + 4).map(async u => {
      try { if (!(await c.match(u))) { const r = await fetch(u, { mode: 'no-cors' }); await c.put(u, r); } } catch {}
      done++;
    }));
    btn.textContent = `⬇ ${Math.round(done / list.length * 100)}%`;
  }
  btn.textContent = '✓ Map saved'; btn.disabled = false; store.set('tilesSaved', Date.now()); toast(`Saved ${list.length} map tiles for offline use`);
};

/* ---------- itinerary ---------- */
function stopHTML(d, di, s, si) {
  const p = TRIP.places[s.place], r = TRIP.reservations.find(x => x.id === s.res);
  const badge = s.status === 'pending' ? ' <span class="badge b-pending">Pending</span>' : s.status === 'idea' ? ' <span class="badge b-idea">Idea</span>' : s.status === 'claude' ? ' <span class="badge b-rec">✨ Claude recommends</span>' : '';
  const conf = r?.conf && !PRIVATE ? ` · <span class="conf" data-copy="${esc(r.conf)}">${esc(r.conf)}</span>` : '';
  return `<div class="stop${s.status === 'claude' ? ' rec' : ''}" data-d="${di}" data-s="${si}">
    ${s.status === 'claude' ? `<div class="num recnum">✨</div>` : `<div class="num ${p ? '' : 'nomap'}" style="background:${d.color}">${p ? s._n ?? '' : ICON[s.type] || '•'}</div>`}
    <div>
      ${s.time ? `<div class="stop-time">${esc(s.time)}</div>` : ''}
      <div class="stop-title">${ICON[s.type] || ''} ${esc(s.title)}${badge}</div>
      ${s.note || conf ? `<div class="stop-note">${esc(s.note || '')}${conf}</div>` : ''}
      ${s.flag ? `<div class="flag">⚠️ ${esc(s.flag)}</div>` : ''}
      <div class="stop-links">${p ? `<a href="${dirLink(p)}" target="_blank" rel="noopener">Directions ↗</a>` : ''}${r ? `<a href="#" data-res="${r.id}">Booking details</a>` : ''}</div>
    </div></div>
    ${s.next ? `<div class="conn">${esc(s.next)}</div>` : ''}`;
}
function renderItinerary() {
  const open = new Set(store.get('openDays', null) ?? [todayIndex() >= 0 ? todayIndex() : 0]);
  $('#p-itinerary').innerHTML = `<div class="filter-row no-print">
      <button class="chip-btn" id="expandAll">Expand all</button><button class="chip-btn" id="collapseAll">Collapse all</button><label class="chip-btn" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="recToggle" ${store.get('recs', true) ? 'checked' : ''}> ✨ Claude recommendations</label></div>
    <p class="small muted no-print" style="margin:-4px 0 12px">Stops marked <span class="badge b-rec">✨ Claude recommends</span> are optional suggestions from Claude, not bookings. Check opening hours (especially Dec 24–25) before going.</p>` +
    TRIP.days.map((d, di) => {
      const city = [...new Set(d.stops.map(s => s.place).filter(Boolean))].length;
      return `<article class="day ${open.has(di) ? 'open' : ''} ${di === todayIndex() ? 'today' : ''}" data-d="${di}">
      <button class="day-head" aria-expanded="${open.has(di)}"><span class="day-swatch" style="background:${d.color}"></span>
        <span><div class="day-title">${fmtDate(d.date)} — ${esc(d.title)}</div><div class="day-sub">Day ${di + 1} · ${d.stops.length} stop${d.stops.length > 1 ? 's' : ''}${di === todayIndex() ? ' · Today' : ''}</div></span>
        <span class="chev">›</span></button>
      <div class="day-body">${d.stops.map((s, si) => stopHTML(d, di, s, si)).join('')}</div></article>`;
    }).join('');
  const saveOpen = () => store.set('openDays', [...document.querySelectorAll('.day.open')].map(e => +e.dataset.d));
  $('#p-itinerary').onclick = e => {
    const cp = e.target.closest('[data-copy]'); if (cp) { e.stopPropagation(); copy(cp.dataset.copy); return; }
    const rl = e.target.closest('[data-res]'); if (rl) { e.preventDefault(); openRes(rl.dataset.res); return; }
    if (e.target.closest('a')) return;
    const h = e.target.closest('.day-head');
    if (h) { const day = h.parentElement; day.classList.toggle('open'); h.setAttribute('aria-expanded', day.classList.contains('open')); if (day.classList.contains('open')) fitDay(+day.dataset.d); saveOpen(); return; }
    const st = e.target.closest('.stop'); if (st) selectStop(+st.dataset.d, +st.dataset.s);
  };
  $('#recToggle').onchange = e => { store.set('recs', e.target.checked); document.body.classList.toggle('hide-recs', !e.target.checked); };
  $('#expandAll').onclick = () => { document.querySelectorAll('.day').forEach(d => d.classList.add('open')); saveOpen(); };
  $('#collapseAll').onclick = () => { document.querySelectorAll('.day').forEach(d => d.classList.remove('open')); saveOpen(); };
}
function todayIndex() { const t = new Date().toLocaleDateString('en-CA'); return TRIP.days.findIndex(d => d.date === t); }
function copy(t) { navigator.clipboard?.writeText(t).then(() => toast('Copied ' + t), () => toast(t)); }

/* ---------- reservations ---------- */
const KIND = { flight: 'Flights', lodging: 'Lodging', car: 'Car', transfer: 'Transfers', activity: 'Activities' };
function resStatus(r) {
  return r.status === 'paid' ? '<span class="badge b-paid">Paid</span>' : r.status === 'points' ? '<span class="badge b-points">Paid · points</span>' : '<span class="badge b-owed">Payment due</span>';
}
function resHTML(r) {
  const p = TRIP.places[r.place];
  const rows = [
    ['Provider', esc(r.provider)],
    !PRIVATE && r.conf && ['Confirmation', `<span class="conf" data-copy="${esc(r.conf)}">${esc(r.conf)}</span>`],
    r.when && ['When', esc(r.when)],
    r.checkin && ['Check-in', esc(r.checkin)],
    r.checkout && ['Check-out', esc(r.checkout)],
    r.address && ['Address', p ? `<a href="${mapsLink(p)}" target="_blank" rel="noopener">${esc(r.address)}</a>` : esc(r.address)],
    !PRIVATE && r.phone && ['Phone', `<a href="tel:${tel(r.phone)}">${esc(r.phone)}</a>${r.phoneNote ? ' · ' + esc(r.phoneNote) : ''}${r.phoneNote === 'WhatsApp' ? ` · <a href="https://wa.me/${tel(r.phone).slice(1)}" target="_blank" rel="noopener">Open chat</a>` : ''}`],
    !PRIVATE && r.extra && ['Also', esc(r.extra)],
    r.details && ['Details', esc(r.details)],
    r.cancel && ['Cancellation', esc(r.cancel)],
    !PRIVATE && r.cost && ['Cost', esc(r.cost)]
  ].filter(Boolean);
  return `<div class="card" id="res-${r.id}">
    <div class="res-head"><div class="res-icon">${ICON[r.kind] || '📄'}</div>
      <div style="flex:1;min-width:0"><h3>${esc(r.title)}</h3>${PRIVATE ? '' : resStatus(r)}</div></div>
    <dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${r.flag ? `<div class="flag">⚠️ ${esc(r.flag)}</div>` : ''}
    ${PRIVATE ? '' : `<div class="att" data-att="${r.id}"></div>`}
  </div>`;
}
let resFilter = 'all';
function renderReservations() {
  const kinds = ['all', ...new Set(TRIP.reservations.map(r => r.kind))];
  $('#p-reservations').innerHTML = `<input class="search no-print" id="resSearch" placeholder="Search bookings, confirmation numbers, addresses…">
    <div class="filter-row no-print">${kinds.map(k => `<button class="chip-btn ${k === resFilter ? 'primary' : ''}" data-k="${k}">${k === 'all' ? 'All' : KIND[k]}</button>`).join('')}</div>
    <div id="resList"></div>`;
  const draw = () => {
    const q = $('#resSearch').value.toLowerCase();
    $('#resList').innerHTML = TRIP.reservations.filter(r => (resFilter === 'all' || r.kind === resFilter) && (!q || JSON.stringify(r).toLowerCase().includes(q))).map(resHTML).join('') || '<p class="muted">No matches.</p>';
    drawAttachments();
  };
  $('#resSearch').oninput = draw;
  $('#p-reservations').onclick = e => {
    const k = e.target.closest('[data-k]'); if (k) { resFilter = k.dataset.k; renderReservations(); return; }
    const cp = e.target.closest('[data-copy]'); if (cp) return copy(cp.dataset.copy);
    const up = e.target.closest('[data-up]'); if (up) return pickFiles(up.dataset.up);
    const f = e.target.closest('[data-file]'); if (f) return openFile(+f.dataset.file);
  };
  draw();
}
function openRes(id) { showTab('reservations'); resFilter = 'all'; renderReservations(); const el = $('#res-' + id); el?.scrollIntoView({ behavior: 'smooth', block: 'start' }); el && (el.style.outline = '2px solid var(--orange)', setTimeout(() => el.style.outline = '', 1600)); }

/* ---------- files (IndexedDB, on-device, works offline) ---------- */
const DB = (() => {
  let p; const open = () => p ||= new Promise((res, rej) => { const r = indexedDB.open('sa26-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const out = fn(t.objectStore('files')); t.oncomplete = () => res(out.result ?? out); t.onerror = () => rej(t.error); }); };
  return { all: () => tx('readonly', s => s.getAll()), add: f => tx('readwrite', s => s.add(f)), del: id => tx('readwrite', s => s.delete(id)), get: id => tx('readonly', s => s.get(id)) };
})();
let pickTarget = '';
function pickFiles(resId) { pickTarget = resId; $('#filePick').value = ''; $('#filePick').click(); }
$('#filePick').onchange = e => saveFiles([...e.target.files], pickTarget);
async function saveFiles(files, resId) {
  try { for (const f of files) await DB.add({ name: f.name, type: f.type, size: f.size, blob: f, resId: resId || '', added: Date.now() });
    toast(`Saved ${files.length} file${files.length > 1 ? 's' : ''} on this device`); drawAttachments(); renderFiles(); }
  catch (err) { toast('Could not save file: ' + err.message); }
}
async function openFile(id) { const f = await DB.get(id); if (!f) return; const url = URL.createObjectURL(f.blob); window.open(url, '_blank') || (location.href = url); setTimeout(() => URL.revokeObjectURL(url), 60000); }
async function drawAttachments() {
  if (PRIVATE) return; let files = []; try { files = await DB.all(); } catch {}
  document.querySelectorAll('[data-att]').forEach(el => {
    const mine = files.filter(f => f.resId === el.dataset.att);
    el.innerHTML = mine.map(f => `<span class="file-pill" data-file="${f.id}">📎 ${esc(f.name)}</span>`).join('') + `<button class="chip-btn" data-up="${el.dataset.att}">＋ Attach file</button>`;
  });
}
async function renderFiles() {
  if (PRIVATE) return; let files = []; try { files = await DB.all(); } catch {}
  const resName = id => TRIP.reservations.find(r => r.id === id)?.title || 'General';
  $('#p-files').innerHTML = `<h2>Files & documents</h2>
    <p class="muted small">Boarding passes, vouchers, tickets, PDFs, screenshots. Files are stored <b>only on this device</b> (in the browser), never uploaded — so they're available offline and stay private. Add them on each device you'll travel with.</p>
    <div class="card drop" id="drop">Drop files here or <button class="chip-btn primary" id="upAny">Choose files</button>
      <div class="small" style="margin-top:8px">Attach to: <select id="upFor" class="chip-btn"><option value="">General</option>${TRIP.reservations.map(r => `<option value="${r.id}">${esc(r.title)}</option>`).join('')}</select></div></div>
    <div class="card">${files.length ? `<div class="table-wrap"><table><tr><th>File</th><th>Booking</th><th class="n">Size</th><th></th></tr>
      ${files.sort((a, b) => b.added - a.added).map(f => `<tr><td><a href="#" data-file="${f.id}">📎 ${esc(f.name)}</a></td><td>${esc(resName(f.resId))}</td><td class="n">${(f.size / 1024).toFixed(0)} KB</td><td class="n"><button class="chip-btn" data-delfile="${f.id}">Delete</button></td></tr>`).join('')}
      </table></div>` : '<p class="muted">No files yet.</p>'}</div>`;
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); saveFiles([...e.dataTransfer.files], $('#upFor').value); };
  $('#upAny').onclick = () => pickFiles($('#upFor').value);
  $('#p-files').onclick = async e => {
    const f = e.target.closest('[data-file]'); if (f) { e.preventDefault(); openFile(+f.dataset.file); }
    const d = e.target.closest('[data-delfile]'); if (d && confirm('Delete this file from this device?')) { await DB.del(+d.dataset.delfile); renderFiles(); drawAttachments(); }
  };
}

/* ---------- budget ---------- */
const CATS = { Flights: '#3a7ca5', Lodging: '#1f4d3a', Activities: '#e8743b', Transport: '#d4a017', Photography: '#7b5ea7' };
let rate = +store.get('rate', TRIP.defaultRate) || TRIP.defaultRate;
const usdOf = b => (b.usd || 0) + (b.zar || 0) / rate;            // cash only; points value excluded
const fUSD = n => 'USD ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fZAR = n => 'ZAR ' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
function budgetCalc() {
  const by = s => TRIP.budget.filter(b => b.status === s);
  const sum = (arr, k) => arr.reduce((a, b) => a + (b[k] || 0), 0);
  const paid = by('paid'), owed = by('owed');
  const cats = Object.keys(CATS).map(c => [c, TRIP.budget.filter(b => b.cat === c).reduce((a, b) => a + usdOf(b), 0)]);
  const total = cats.reduce((a, [, v]) => a + v, 0);
  const pts = {}; TRIP.budget.filter(b => b.points).forEach(b => pts[b.unit] = (pts[b.unit] || 0) + b.points);
  const redeemedZar = sum(TRIP.budget, 'valueZar');
  return { paidZar: sum(paid, 'zar'), paidUsd: sum(paid, 'usd'), owedZar: sum(owed, 'zar'), owedUsd: sum(owed, 'usd'),
    paidTot: paid.reduce((a, b) => a + usdOf(b), 0), owedTot: owed.reduce((a, b) => a + usdOf(b), 0), cats, total, pts, redeemedZar };
}
function donut(cats, total) {
  let a = -Math.PI / 2; const R = 70, r = 44, cx = 90, cy = 90;
  const arcs = cats.filter(([, v]) => v > 0).map(([c, v]) => {
    const ang = v / total * Math.PI * 2, a2 = a + ang, large = ang > Math.PI ? 1 : 0;
    const P = (rad, rr) => `${cx + rr * Math.cos(rad)} ${cy + rr * Math.sin(rad)}`;
    const d = `M ${P(a, R)} A ${R} ${R} 0 ${large} 1 ${P(a2, R)} L ${P(a2, r)} A ${r} ${r} 0 ${large} 0 ${P(a, r)} Z`; a = a2;
    return `<path d="${d}" fill="${CATS[c]}" stroke="var(--card)" stroke-width="2"><title>${c}: ${fUSD(v)}</title></path>`;
  }).join('');
  return `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Spending by category">${arcs}
    <text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text>
    <text x="90" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">$${Math.round(total).toLocaleString()}</text></svg>`;
}
function renderBudget() {
  if (PRIVATE) return;
  const B = budgetCalc(), n = TRIP.travelers.length;
  const pct = B.paidTot / (B.paidTot + B.owedTot) * 100;
  $('#p-budget').innerHTML = `
    <div class="card rate"><b>Exchange rate</b> <input id="rate" type="number" step="0.1" min="1" value="${rate}"> ZAR per USD
      <button class="chip-btn" id="rateReset">Reset to ${TRIP.defaultRate}</button></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Total out-of-pocket</div><div class="v">${fUSD(B.total)}</div><div class="s">${fZAR(B.total * rate)}</div></div>
      <div class="kpi"><div class="l">Per person (÷${n})</div><div class="v">${fUSD(B.total / n)}</div><div class="s">${fZAR(B.total * rate / n)}</div></div>
      <div class="kpi"><div class="l">Paid so far</div><div class="v">${fUSD(B.paidTot)}</div><div class="s">${fZAR(B.paidZar)} + ${fUSD(B.paidUsd)}</div></div>
      <div class="kpi"><div class="l">Still owed</div><div class="v" style="color:var(--orange)">${fUSD(B.owedTot)}</div><div class="s">${fZAR(B.owedZar)} + ${fUSD(B.owedUsd)}</div></div>
    </div>
    <div class="card"><h3>Paid vs. still owed</h3><div class="bar"><span style="width:${pct}%"></span></div>
      <div class="small muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>🟩 Paid ${pct.toFixed(0)}%</span><span>Owed ${(100 - pct).toFixed(0)}% 🟧</span></div></div>
    <div class="card"><h3>By category</h3><div class="donut-wrap">${donut(B.cats, B.total)}
      <div class="legend">${B.cats.map(([c, v]) => `<div><i style="background:${CATS[c]}"></i><span style="min-width:96px">${c}</span><b>${fUSD(v)}</b><span class="muted">&nbsp;· ${fZAR(v * rate)}</span></div>`).join('')}</div></div></div>
    <div class="card"><h3>Value redeemed (not in out-of-pocket)</h3>
      <div class="small">${Object.entries(B.pts).map(([u, v]) => `<span class="badge b-points">${v.toLocaleString()} ${esc(u)}</span>`).join(' ')}</div>
      <div class="small muted" style="margin-top:6px">Cash-equivalent of points stays: ${fZAR(B.redeemedZar)} ≈ ${fUSD(B.redeemedZar / rate)}</div></div>
    <div class="card"><h3>All line items</h3><div class="table-wrap"><table>
      <tr><th>Item</th><th>Category</th><th class="n">ZAR</th><th class="n">USD</th><th>Status</th></tr>
      ${TRIP.budget.map(b => {
        const pts = b.points ? `<div class="small muted">${b.points.toLocaleString()} ${esc(b.unit)}${b.valueZar ? ` · value ${fZAR(b.valueZar)} (excluded)` : ''}</div>` : '';
        const cash = b.usd || b.zar ? usdOf(b) : null;
        const st = b.status === 'paid' ? (b.points && !b.usd && !b.zar ? '<span class="badge b-points">Paid · points</span>' : '<span class="badge b-paid">Paid</span>') : b.status === 'owed' ? '<span class="badge b-owed">Owed</span>' : '<span class="badge b-idea">TBD</span>';
        return `<tr><td>${esc(b.item)}${pts}${b.note ? `<div class="small muted">${esc(b.note)}</div>` : ''}</td><td>${b.cat}</td>
          <td class="n">${cash == null ? '—' : (b.zar ? '' : '≈ ') + fZAR(cash * rate).slice(4)}</td><td class="n">${cash == null ? '—' : (b.usd ? '' : '≈ ') + fUSD(cash).slice(4)}</td><td>${st}</td></tr>`;
      }).join('')}
      <tr><th colspan="2">Total</th><th class="n">${fZAR(B.total * rate).slice(4)}</th><th class="n">${fUSD(B.total).slice(4)}</th><th></th></tr></table></div>
      <p class="small muted">≈ = converted at the rate above. Original-currency amounts shown without ≈.</p></div>
    <div class="card"><h3>Not yet budgeted</h3><div class="filter-row" style="margin:0">${TRIP.unbudgeted.map(u => `<span class="chip">${esc(u)}</span>`).join('')}</div></div>`;
  $('#rate').oninput = e => { const v = parseFloat(e.target.value); if (v > 0) { rate = v; store.set('rate', v); const pos = e.target.selectionStart; renderBudget(); const i = $('#rate'); i.focus(); try { i.setSelectionRange(pos, pos); } catch {} } };
  $('#rateReset').onclick = () => { rate = TRIP.defaultRate; store.set('rate', rate); renderBudget(); };
}

/* ---------- notes & to-do ---------- */
function renderNotes() {
  const done = store.get('todoDone', {}), extra = store.get('todoExtra', []);
  const all = [...TRIP.todos.map((t, i) => ({ id: 'b' + i, t })), ...extra.map(x => ({ ...x, custom: true }))];
  const left = all.filter(x => !done[x.id]).length;
  $('#p-notes').innerHTML = `<div class="card"><h3>To-do <span class="muted small">· ${left} of ${all.length} left</span></h3>
    ${all.map(x => `<label class="todo ${done[x.id] ? 'done' : ''}"><input type="checkbox" data-id="${x.id}" ${done[x.id] ? 'checked' : ''}><span>${esc(x.t)}</span>${x.custom ? `<button class="del" data-del="${x.id}" title="Remove">✕</button>` : ''}</label>`).join('')}
    <div class="add-row no-print"><input id="newTodo" placeholder="Add a to-do…"><button class="chip-btn primary" id="addTodo">Add</button></div></div>
    <div class="card"><h3>Travelers</h3><p class="small" style="margin:0">${TRIP.travelers.map(t => esc(t.name)).join(' & ')} · 🥗 ${esc(TRIP.diet)}</p></div>
    <div class="card"><h3>Notes</h3><textarea id="notes" placeholder="Packing list, ideas, restaurant recs… (saved on this device)">${esc(store.get('notes', ''))}</textarea></div>`;
  $('#p-notes').onchange = e => { const id = e.target.dataset.id; if (id) { const d = store.get('todoDone', {}); d[id] = e.target.checked; store.set('todoDone', d); renderNotes(); renderOverview(); } };
  $('#p-notes').onclick = e => { const d = e.target.closest('[data-del]'); if (d) { e.preventDefault(); store.set('todoExtra', store.get('todoExtra', []).filter(x => x.id !== d.dataset.del)); renderNotes(); } };
  const add = () => { const v = $('#newTodo').value.trim(); if (!v) return; store.set('todoExtra', [...store.get('todoExtra', []), { id: 'c' + Date.now(), t: v }]); renderNotes(); $('#newTodo').focus(); };
  $('#addTodo').onclick = add; $('#newTodo').onkeydown = e => e.key === 'Enter' && add();
  $('#notes').oninput = e => store.set('notes', e.target.value);
}

/* ---------- overview ---------- */
function renderOverview() {
  const now = new Date(), start = new Date(TRIP.start + 'T00:00:00'), days = Math.ceil((start - now) / 864e5);
  const ti = todayIndex();
  const countdown = days > 0 ? `<b>${days}</b> day${days > 1 ? 's' : ''} to go` : ti >= 0 ? `Day ${ti + 1} of ${TRIP.days.length} — enjoy!` : 'Trip complete';
  const done = store.get('todoDone', {}), open = TRIP.todos.filter((_, i) => !done['b' + i]);
  const stays = TRIP.reservations.filter(r => r.kind === 'lodging');
  const nightsOf = r => { const s = TRIP.days.findIndex(d => d.stops.some(x => x.res === r.id && /Check in/.test(x.title))), e = TRIP.days.findIndex(d => d.stops.some(x => x.res === r.id && /Check out/.test(x.title))); return e > s ? e - s : ''; };
  const flags = TRIP.days.flatMap(d => d.stops.filter(s => s.flag || s.status === 'pending').map(s => ({ d, s })));
  $('#p-overview').innerHTML = `
    <div class="card" style="background:var(--green);color:var(--bg);border:0"><div class="small" style="opacity:.8">Countdown</div><div style="font-size:24px">${countdown}</div>
      <div class="small" style="opacity:.8">${esc(TRIP.route || '')}</div></div>
    <div class="card"><h3>Where you're staying</h3><div class="table-wrap"><table>
      ${stays.map(r => `<tr><td><a href="#" data-res="${r.id}">${esc(r.title)}</a></td><td class="muted">${esc((r.checkin || '').split('·')[0])}→ ${esc((r.checkout || '').split('·')[0])}</td><td class="n">${nightsOf(r)} night${nightsOf(r) === 1 ? '' : 's'}</td></tr>`).join('')}
    </table></div></div>
    <div class="card"><h3>Heads-up</h3>${flags.map(({ d, s }) => `<div class="flag"><b>${fmtDate(d.date)}</b> · ${esc(s.title)} — ${esc(s.flag || 'Pending / not confirmed')}</div>`).join('')}</div>
    <div class="grid2">
      <div class="card"><h3>Open to-dos</h3><div class="small">${open.length ? open.slice(0, 5).map(t => '☐ ' + esc(t)).join('<br>') + (open.length > 5 ? `<br><a href="#notes" data-tab-link="notes">+${open.length - 5} more</a>` : '') : '✓ All done'}</div></div>
      <div class="card"><h3>Good to know</h3><div class="small">🥗 ${esc(TRIP.diet)}<br>${(TRIP.tips || []).map(esc).join('<br>')}<br>💱 Default rate ${TRIP.defaultRate} ZAR/USD</div></div>
    </div>
    <div class="card no-print small muted">📶 <b>Offline:</b> this page saves itself for offline use after the first visit. Tap <b>“Save map offline”</b> on the map before you fly, and on iPhone use Share → <i>Add to Home Screen</i> for an app-like icon.${PRIVATE ? '' : ' Upload vouchers in the <b>Files</b> tab — they live on your device only.'}</div>`;
  $('#p-overview').onclick = e => { const r = e.target.closest('[data-res]'); if (r) { e.preventDefault(); openRes(r.dataset.res); } const t = e.target.closest('[data-tab-link]'); if (t) { e.preventDefault(); showTab(t.dataset.tabLink); } };
}

/* ---------- calendar export ---------- */
$('#icsBtn').onclick = () => {
  const pad = s => s.replace(/[-:]/g, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//trip//EN', `X-WR-CALNAME:${TRIP.title}`];
  TRIP.days.forEach(d => d.stops.forEach((s, i) => { if (s.status === 'claude') return;
    const m = /^~?(\d{2}):(\d{2})/.exec(s.time || ''); const p = TRIP.places[s.place];
    const r = TRIP.reservations.find(x => x.id === s.res);
    const desc = [s.note, !PRIVATE && r?.conf ? 'Conf ' + r.conf : ''].filter(Boolean).join(' — ').replace(/[,;]/g, '\\$&');
    lines.push('BEGIN:VEVENT', `UID:${d.date}-${i}@sa-trip`, `DTSTAMP:20261101T000000Z`,
      m ? `DTSTART:${pad(d.date)}T${m[1]}${m[2]}00` : `DTSTART;VALUE=DATE:${pad(d.date)}`,
      m ? `DURATION:PT1H` : `DURATION:P1D`,
      `SUMMARY:${s.title.replace(/[,;]/g, '\\$&')}`, desc && `DESCRIPTION:${desc}`, p && `LOCATION:${p.name.replace(/[,;]/g, '\\$&')}`, 'END:VEVENT');
  }));
  lines.push('END:VCALENDAR');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.filter(Boolean).join('\r\n')], { type: 'text/calendar' }));
  a.download = "trip.ics"; a.click(); toast('Calendar file downloaded');
};

/* ---------- theme, print, network ---------- */
const applyTheme = t => { t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'); };
applyTheme(store.get('theme', ''));
$('#themeBtn').onclick = () => { const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#141a17'; const t = dark ? 'light' : 'dark'; store.set('theme', t); applyTheme(t); };
$('#printBtn').onclick = () => { document.querySelectorAll('.day').forEach(d => d.classList.add('open')); window.print(); };
const net = () => $('#net').innerHTML = navigator.onLine ? '<span class="dot"></span>Online · saved for offline' : '<span class="dot off"></span>Offline — showing saved copy';
addEventListener('online', net); addEventListener('offline', net); net();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- boot ---------- */
document.body.classList.toggle('hide-recs', !store.get('recs', true));
initMap(); renderOverview(); renderItinerary(); renderReservations(); renderBudget(); renderFiles(); renderNotes();
showTab(location.hash.slice(1) || 'itinerary');
addEventListener('hashchange', () => showTab(location.hash.slice(1)));
}
</script>
</body>
